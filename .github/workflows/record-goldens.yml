name: Record goldens

# Records the framework's content pipeline tests' golden hashes for the pinned tools (packaging/tool-sources.json)
# on each of the five build machines: test/README.md, "Golden hashes". Goldens are keyed by the
# tools' exact builds, so a machine whose tools changed (a rebuilt spirv2dxil, a new Slang) skips its
# goldens until they're recorded on it. Each machine's new lines are this run's artifacts: look at
# them, then commit them. Run by hand only.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTGAME_UPDATE_GOLDENS: '1'

jobs:
  record:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            msvc: x64
          - os: windows-11-arm
            rid: win-arm64
            msvc: arm64
          - os: ubuntu-22.04
            rid: linux-x64
          - os: ubuntu-22.04-arm
            rid: linux-arm64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    name: record ${{ matrix.rid }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc }}
      - name: Fetch the pinned tools
        run: python packaging/fetch-tools.py ${{ matrix.rid }} artifacts/tools/${{ matrix.rid }}
      # Only the pinned tools: none from the runner's image or a Vulkan SDK
      - name: Put the tools on PATH
        shell: bash
        run: |
          echo "VULKAN_SDK=" >> "$GITHUB_ENV"
          tools="$GITHUB_WORKSPACE/artifacts/tools/${{ matrix.rid }}/tools"
          if [ "$RUNNER_OS" = Windows ]; then tools=$(cygpath -w "$tools"); fi
          echo "$tools" >> "$GITHUB_PATH"
      - name: Framework pipeline tests
        continue-on-error: true
        run: dotnet test --project test/DotGame.Framework.ContentPipeline.Tests
      - name: New goldens
        shell: bash
        run: |
          mkdir -p artifacts/goldens
          for dir in test/DotGame.Framework.ContentPipeline.Tests; do
            name=$(basename "$dir")
            git diff --no-color -U0 -- "$dir/Goldens/goldens.txt" | grep '^+[^+]' | cut -c2- | tr -d '\r' > "artifacts/goldens/$name.txt" || true
            echo "== $name: $(wc -l < "artifacts/goldens/$name.txt") new"
            cat "artifacts/goldens/$name.txt"
          done
          python -c "import json; print(json.dumps(json.load(open('artifacts/tools/${{ matrix.rid }}/versions.json')), indent=1))" > artifacts/goldens/versions.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: goldens-${{ matrix.rid }}
          path: artifacts/goldens/
