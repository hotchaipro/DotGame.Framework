name: SDL3 native libraries

# Rebuilds the framework's native libraries (native/build.ps1) on each OS and
# commits the binaries. Runs only when the native sources or build scripts
# change (a submodule update changes the submodule path), or manually.
# The committed binaries are outside the trigger paths, and pushes made with
# GITHUB_TOKEN don't trigger workflows, so the commit doesn't re-run this.

on:
  push:
    branches: [main]
    paths:
      - 'native/sdl3/src/**'
      - 'native/build.ps1'
      - 'native/sdl3/build.ps1'
      - '.github/workflows/native-sdl3.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Desktop: each OS builds its own platforms. Linux builds on the oldest
          # supported Ubuntu so the binaries run on older glibc versions.
          - os: windows-latest
            platform: win-x64
          - os: windows-latest
            platform: win-arm64
          - os: ubuntu-22.04
            platform: linux-x64
          - os: ubuntu-22.04-arm
            platform: linux-arm64
          - os: macos-latest
            platform: osx-arm64
          - os: macos-latest
            platform: osx-x64

          # Mobile: cross-compiled
          - os: ubuntu-26.04
            platform: android-arm64-v8a
          - os: ubuntu-26.04
            platform: android-x86_64
          - os: macos-latest
            platform: ios-arm64

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout SDL3 submodule
        run: git submodule update --init --depth 1 native/sdl3/src/SDL

      - name: Install Linux build dependencies
        if: runner.os == 'Linux' && !startsWith(matrix.platform, 'android-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols \
            libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            libasound2-dev libpulse-dev \
            libudev-dev libdbus-1-dev libibus-1.0-dev

      # Only the NDK is needed. Download a pinned NDK directly rather than going
      # through sdkmanager, so the build is reproducible.
      - name: Setup Android NDK
        id: setup-ndk
        if: startsWith(matrix.platform, 'android-')
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Set ANDROID_NDK_ROOT
        if: startsWith(matrix.platform, 'android-')
        shell: pwsh
        run: |
          Write-Host "Using NDK: ${{ steps.setup-ndk.outputs.ndk-path }}"
          "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> $env:GITHUB_ENV

      - name: Build native libraries
        shell: pwsh
        run: ./native/build.ps1 -Platform ${{ matrix.platform }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sdl3-native-${{ matrix.platform }}
          path: native/sdl3/${{ matrix.platform }}/
          if-no-files-found: error

  commit:
    needs: build
    runs-on: ubuntu-26.04
    name: Commit binaries

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: sdl3-native-*
          path: staging/

      - name: Copy binaries to native/sdl3/
        shell: pwsh
        run: |
          foreach ($dir in Get-ChildItem -Path staging -Directory) {
            $platform = $dir.Name -replace '^sdl3-native-', ''
            $targetDir = "native/sdl3/$platform"
            Write-Host "Copying $($dir.Name) -> $targetDir"
            New-Item -ItemType Directory -Path $targetDir -Force | Out-Null
            Copy-Item -Path "$($dir.FullName)/*" -Destination $targetDir -Force
            if (Test-Path "$targetDir/.gitkeep") {
              git rm -q "$targetDir/.gitkeep"
            }
            git add $targetDir
          }

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update SDL3 native binaries"
          git pull --rebase
          git push
