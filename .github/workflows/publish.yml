name: Publish

# Packs every package at one version, tests them, and publishes them to nuget.org with trusted publishing:
# no API key is stored anywhere. nuget.org's trusted publishing policy names this repository and this
# workflow, and the login step trades this run's GitHub identity for a key that lasts an hour.
#
# Run by hand, with the version. Leave "Publish" unticked for a dry run: everything but the push, so
# the packages (this run's artifacts) can be looked at first. A version on nuget.org can't be replaced
# or deleted, only unlisted.
#
#   - The tool packages, DotGame.Framework.Build.Tools.<rid>, each on its own build machine (as the
#     Packages workflow packs them).
#   - The others on a Mac, the one machine with every platform's workload (packaging/pack.sh), after
#     checking that the version isn't on nuget.org already.
#   - Each build machine builds the samples' and the template's desktop and web heads from the packages,
#     with no tool installed (packaging/test-packages.sh).
#   - Linux and Windows machines with only the .NET SDK follow the guide: its getting-started game, then
#     the template's desktop head, built and published, and its web and Android heads, installing the
#     Android SDK and a JDK as the guide says (packaging/test-clean.ps1).
#   - Then, if "Publish" is ticked, the push and a draft GitHub release for
#     the version, tagged vVERSION at the commit it published, a prerelease if the version has a suffix.
#     Write its notes and publish it by hand: the tag is made when the draft is published. If the push
#     fails partway, re-run the failed job: packages already on nuget.org are skipped.

on:
  workflow_dispatch:
    inputs:
      version:
        description: The packages' version, such as 0.1.0-preview.1
        required: true
      publish:
        description: Publish to nuget.org (unticked, a dry run)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  tools:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            msvc: x64
          - os: windows-11-arm
            rid: win-arm64
            msvc: arm64
          # The oldest supported Ubuntu, so the tools run on older glibc versions
          - os: ubuntu-22.04
            rid: linux-x64
          - os: ubuntu-22.04-arm
            rid: linux-arm64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    name: tools ${{ matrix.rid }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ./.github/actions/msvc
        with:
          arch: ${{ matrix.msvc }}
      - name: Fetch the pinned tools
        run: python packaging/fetch-tools.py ${{ matrix.rid }} artifacts/tools/${{ matrix.rid }}
      # The tools must run on Ubuntu 22.04's glibc (2.35) and need no libstdc++ newer than its own
      - name: Check the glibc floor
        if: runner.os == 'Linux'
        shell: bash
        run: |
          for f in artifacts/tools/${{ matrix.rid }}/tools/*; do
            need=$(objdump -T "$f" | grep -o 'GLIBC_2\.[0-9]*' | sort -uV | tail -1)
            echo "$(basename "$f"): ${need:-none}"
            if [ -n "$need" ] && [ "$(printf '%s\nGLIBC_2.35\n' "$need" | sort -V | tail -1)" != GLIBC_2.35 ]; then
              echo "::error::$(basename "$f") needs $need"; exit 1
            fi
          done
      - name: Pack
        shell: bash
        run: packaging/pack-tools.sh ${{ matrix.rid }}
      - uses: actions/upload-artifact@v7
        with:
          name: tools-${{ matrix.rid }}
          path: artifacts/packages/*.nupkg
          if-no-files-found: error

  packages:
    # .NET for iOS 27.2 needs Xcode 27.2, which only the xcode-27 image has (a public preview for now)
    runs-on: xcode-27
    name: packages
    steps:
      - name: Check the version
        shell: bash
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::Not a version: $VERSION"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://api.nuget.org/v3-flatcontainer/dotgame.framework/$VERSION/dotgame.framework.nuspec")
          [ "$code" = 404 ] || { echo "::error::DotGame.Framework $VERSION is on nuget.org already (HTTP $code)"; exit 1; }
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
      - name: Select Xcode 27.2
        run: sudo xcode-select -s /Applications/Xcode_27.2.app
      - name: Install the workloads
        run: dotnet workload install android ios wasm-tools
      - name: Pack
        shell: bash
        run: |
          status=0
          PLATFORMS="desktop android ios webgl" packaging/pack.sh > pack.log 2>&1 || status=$?
          grep -E ": error |^== |packages checked|\.nupkg: " pack.log | sort -u | head -40
          exit $status
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pack-log
          path: pack.log
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/packages/*.nupkg
          if-no-files-found: error

  test:
    needs: [tools, packages]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: windows-11-arm, rid: win-arm64 }
          - { os: ubuntu-26.04, rid: linux-x64 }
          - { os: ubuntu-26.04-arm, rid: linux-arm64 }
          - { os: macos-latest, rid: osx-arm64 }
    runs-on: ${{ matrix.os }}
    name: test ${{ matrix.rid }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
      - name: Install the web workload
        run: dotnet workload install wasm-tools
      - uses: actions/download-artifact@v8
        with:
          pattern: '*'
          path: artifacts/packages
          merge-multiple: true
      - name: Build the samples from packages
        shell: bash
        run: packaging/test-packages.sh desktop webgl

  # The guide's steps on machines with only the .NET SDK: Microsoft's SDK images, with no JDK, Android
  # SDK, Python or compilers (packaging/test-clean.ps1). iOS needs a Mac with Xcode, which no container has.
  clean-linux:
    needs: [tools, packages]
    runs-on: ubuntu-26.04
    name: clean linux-x64
    container: mcr.microsoft.com/dotnet/sdk:11.0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: '*'
          path: feed
          merge-multiple: true
      # The one thing the guide asks Linux for besides the .NET SDK: Python 3, for the web's Emscripten
      - name: Install Python 3, as the guide says
        run: apt-get update -qq && apt-get install -y -qq python3 > /dev/null
      - name: The guide's steps
        run: pwsh packaging/test-clean.ps1 feed "$VERSION" webgl android

  clean-windows:
    needs: [tools, packages]
    runs-on: windows-2025
    name: clean win-x64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: '*'
          path: feed
          merge-multiple: true
      - name: The guide's steps
        shell: pwsh
        run: |
          docker run --rm -v "${env:GITHUB_WORKSPACE}:C:\w" -e DOTGAME_CLEAN_WORK=C:\clean `
            mcr.microsoft.com/dotnet/sdk:11.0-windowsservercore-ltsc2025 `
            pwsh -File C:\w\packaging\test-clean.ps1 C:\w\feed $env:VERSION webgl android
          exit $LASTEXITCODE

  publish:
    needs: [tools, packages, test, clean-linux, clean-windows]
    if: inputs.publish
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: '*'
          path: out
          merge-multiple: true
      - name: Check the packages
        shell: bash
        run: |
          ls out
          n=$(ls out/*."$VERSION".nupkg | wc -l)
          [ "$n" -eq 12 ] || { echo "::error::$n packages at $VERSION, not 12"; exit 1; }
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
      - uses: NuGet/login@v1
        id: login
        with:
          user: hotchai
      - run: dotnet nuget push "out/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --skip-duplicate
      - name: Draft the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" > /dev/null 2>&1; then echo "$TAG already has a release"; exit 0; fi
          PRERELEASE=""
          [[ "$VERSION" == *-* ]] && PRERELEASE="--prerelease"
          cat > notes.md <<EOF
          TODO: what changed, and any breaking changes.

          \`\`\`bash
          dotnet new install DotGame.Templates::$VERSION
          dotnet new dotgame -n MyGame
          \`\`\`

          NuGet: https://www.nuget.org/packages/DotGame.Framework/$VERSION
          EOF
          create() {
            gh release create "$TAG" --draft $PRERELEASE --target "$GITHUB_SHA" \
              --title "DotGame.Framework $VERSION" --notes-file notes.md
          }
          create && exit 0
          # Once more with the GitHub API exchange shown (gh hides the token), so a failure says why
          GH_DEBUG=api create
